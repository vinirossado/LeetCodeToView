# nginx config for the frontend container — proxies /executions and
# /analysis to the `leetcodeview-api` container. Both containers are plain
# `docker run` (systemd-managed, see .ci/leetcodeview-api.service and
# .ci/leetcodeview-fe.service), joined to the same plain user-defined
# bridge network (`leetcodeview-net`, created once, see .ci/readme.md).
# `resolver`+variable (deferred resolution) instead of a static
# `proxy_pass http://leetcodeview-api:8080` so nginx doesn't crash-loop if
# this container happens to start before `leetcodeview-api` does — a
# static proxy_pass resolves the hostname once at startup and never
# retries.
server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream leetcodeview-api:8080;

    location /executions {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /analysis {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
