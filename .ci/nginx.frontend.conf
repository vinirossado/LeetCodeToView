# Production nginx config for the frontend container (Swarm), analogous to
# frontend/nginx.conf (local docker-compose) but NOT identical — found a
# real difference by actually running this image standalone (not just by
# inspection):
#
# frontend/nginx.conf does `proxy_pass http://api:8080;` — a static
# hostname, which nginx resolves ONCE at config load / worker startup.
# `api` is docker-compose's network alias for the sibling `api` service in
# the SAME compose project; it doesn't exist at all once frontend and api
# are deployed as two SEPARATE Swarm stacks (see deploy.sh/deploy-fe.sh —
# `leetcodeview` and `leetcodeview-fe`). Confirmed empirically: reusing
# frontend/nginx.conf as-is here makes nginx crash on startup with
# "host not found in upstream 'api'" — the container never comes up.
#
# Fix, two parts:
#   1. The right hostname is `leetcodeview_api` — Swarm's cross-stack DNS
#      naming convention (`<stack>_<service>`), resolvable from ANY
#      service on the same (external) overlay network, not just services
#      within the same stack. Both stacks attach to `proxy_net` (see
#      .ci/stack.yml / .ci/stack-fe.yml), so this works. This hardcodes the
#      backend stack name from deploy.sh's STACK_NAME="leetcodeview" — if
#      that ever changes, this must change too (no templating here).
#   2. Resolve it at REQUEST time via the `resolver`/variable pattern
#      below, not at startup — Swarm doesn't guarantee the backend stack
#      is already deployed/resolvable when a frontend task starts (first
#      deploy ordering between the two stacks, or either stack's rolling
#      update). A static proxy_pass would crash-loop the frontend
#      container any time that ordering isn't perfect; this way nginx
#      stays up and just 502s an individual request if the backend is
#      momentarily unreachable.
server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream leetcodeview_api:8080;

    location /executions {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # WebSocket upgrade for GET /executions/:id/events; harmless for
        # the plain POST/GET routes under the same prefix.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /analysis {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
