# nginx config for the Pi's Swarm-free deploy (see .ci/readme.md's "Pi
# (ambiente de teste local)" section) — same shape as .ci/nginx.frontend.conf
# (deferred `resolver`+variable resolution, so nginx doesn't crash-loop if
# this container starts before `leetcodeview-api` does), but the upstream
# name is different: on the Pi, BOTH containers are plain `docker run`
# (systemd-managed, not Swarm services — see .ci/leetcodeview-api.service and
# .ci/leetcodeview-fe.service), joined to the same plain user-defined bridge
# network (`leetcodeview-net`, created once, see .ci/readme.md). A plain
# bridge network's embedded DNS (127.0.0.11) resolves a sibling container by
# its `--name` directly — there is no Swarm cross-stack `<stack>_<service>`
# naming here, so the upstream is just `leetcodeview-api`, not
# `leetcodeview_api`.
server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream leetcodeview-api:8080;

    location /executions {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /analysis {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
