name: CI - API

# Only run when files under api/ (or this workflow itself) change, since this
# is a monorepo with four independently-versioned pieces.
on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  test:
    name: Build & test (Maven / Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Run tests
        run: ./mvnw -B test
