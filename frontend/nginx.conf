# Reverse-proxies API paths to the `api` compose service (matches the
# production environment's empty apiBaseUrl/wsBaseUrl — same-origin, no
# CORS) and serves the Angular SPA for everything else.

server {
    listen 80;

    location /executions {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # WebSocket upgrade for GET /executions/:id/events; harmless for
        # the plain POST/GET routes under the same prefix.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /analysis {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
