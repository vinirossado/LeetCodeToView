# Swaps the real ProcessSandboxRunner for FakeSandboxRunner in tests, so
# nothing here touches nsjail/Docker/the real binary.
quarkus.arc.selected-alternatives=com.code2complexity.api.support.FakeSandboxRunner,com.code2complexity.api.support.FakeStaticAnalyzer

# Small limits so RateLimitingFilterTest doesn't need to fire dozens of
# real HTTP requests (through the full Quarkus/RestAssured stack) to
# exercise the 429 path — production defaults (application.properties)
# are 10/60 and 30/60.
rate-limit.executions.max-requests=3
rate-limit.executions.window-seconds=60
rate-limit.analysis.max-requests=3
rate-limit.analysis.window-seconds=60
