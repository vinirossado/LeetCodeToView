# snake_case wire format everywhere (execution_id, time_ns, ...) while
# Java code stays camelCase (executionId, timeNs, ...).
quarkus.jackson.property-naming-strategy=SNAKE_CASE

sandbox.runner.binary-path=../sandbox/target/release/sandbox-runner
static-analyzer.binary-path=../static-analyzer/target/release/static-analyzer

# Per-IP rate limits (see RateLimitingFilter) — MVP defaults, not load-tested.
# /executions actually ties up an nsjail/dotnet-build slot, hence the
# tighter limit than /analysis (tree-sitter parsing only).
rate-limit.executions.max-requests=10
rate-limit.executions.window-seconds=60
rate-limit.analysis.max-requests=30
rate-limit.analysis.window-seconds=60
