# Local-dev stack: run everything with `docker compose up --build`.
#
# `api` bundles the Quarkus API + sandbox-runner + static-analyzer in one
# container (see Dockerfile.api for why: no real IPC contract between API
# and Sandbox Controller yet, ProcessSandboxRunner/ProcessStaticAnalyzer
# shell out to local binaries). It needs nsjail's namespace/cgroup
# privileges to actually sandbox anything.
#
# **Not `privileged: true` anymore** — replaced with the minimal set found
# and validated empirically (tasks.md Fase 0.5 backlog item, closed): real
# `POST /executions` runs (Java/C#/Ruby) plus the FilesystemEscape/
# NetworkEscape pentest snippets all behave identically to the old
# `privileged: true` baseline under this config. Four independent pieces,
# all required together (removing any one reproduces a real, distinct
# nsjail failure — not guessed, each isolated by testing it removed):
#   1. `cap_add` below (7 caps, not `setcap` — this project's earlier
#      Fase 0.5 spike tested a similar 6-cap set via `setcap` on a non-root
#      user and hit an insurmountable `setgroups` failure in the user
#      namespace; that does NOT reproduce here, because this container
#      runs nsjail as root (`orig_euid==0`), which is a different code path
#      in nsjail's own user.cc — confirmed by reading nsjail's source).
#      `DAC_OVERRIDE` is the one that isn't obvious: root without it is
#      still subject to normal DAC checks on cgroupfs once `cap_drop: ALL`
#      strips it, so nsjail's `mkdir cgroup.../NSJAIL.<pid>` fails with
#      "Permission denied" without it, confirmed empirically.
#   2. `cgroup: host` (`--cgroupns=host`) — same requirement already
#      documented before (nsjail needs the host's root cgroupv2 hierarchy,
#      fails with "Couldn't write to cgroup.subtree_control: Device or
#      resource busy" otherwise).
#   3. The explicit `/sys/fs/cgroup:rw` bind mount — `cgroup: host` alone
#      still leaves `/sys/fs/cgroup` mounted **read-only** inside the
#      container (confirmed via `mount | grep cgroup` showing `ro`, and via
#      nsjail failing `mkdir(...): Read-only file system` without this).
#      Docker mounts it ro by default for any non-`privileged` container
#      regardless of capabilities or `cgroupns`; there's no narrower
#      per-mount flag for this, only this explicit override or full
#      `privileged`.
#   4. `security_opt: [systempaths=unconfined, seccomp=unconfined]` —
#      the two hardest-won findings here, neither is a capability gap:
#        - `systempaths=unconfined` disables Docker's default masked/
#          readonly bind-mounts under `/proc` and `/sys` (e.g. `/dev/null`
#          over `/proc/kcore`). Without it nsjail's own nested `mount
#          --bind` of a fresh procfs for the jail's new PID namespace fails
#          with EPERM — nsjail's own log line names this exact mechanism:
#          "procfs mount may fail if /proc has overmounts".
#        - `seccomp=unconfined` was the most surprising finding: Docker's
#          *default* seccomp profile blocks `pivot_root` for non-privileged
#          containers **unconditionally** — confirmed by testing with
#          `--cap-add=ALL` (literally every Linux capability) under the
#          default profile and still hitting `pivot_root(...): Operation
#          not permitted`. This is not gated on capabilities at all; only
#          `--privileged` or disabling the profile lifts it. A hand-written
#          custom seccomp profile that allowlists just `pivot_root`/`mount`/
#          `unshare` (narrower than fully unconfined) was not attempted —
#          real further-narrowing candidate for later, not done here.
#
# Net effect vs the old `privileged: true`: same seccomp/systempaths
# posture (both already fully open under `privileged`), but ~33 fewer
# Linux capabilities (7 instead of all ~40 — no `CAP_SYS_MODULE`,
# `CAP_SYS_BOOT`, `CAP_SYS_PTRACE`, `CAP_MAC_ADMIN`, etc.) and **no**
# device passthrough (`privileged` also grants access to all host
# devices; this config grants none). Real, validated narrowing — not a
# full fix (seccomp confinement for the outer container is still fully
# open, same as before). See tasks.md for the full investigation.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - NET_ADMIN
      - SYS_RESOURCE
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    cgroup: host
    security_opt:
      - systempaths=unconfined
      - seccomp=unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      - DOTNET_GCHeapHardLimit=0x8000000
      # Rate-limit headroom for local dev / the E2E suite ONLY — does NOT
      # touch the real production default (api/src/main/resources/
      # application.properties' rate-limit.executions.max-requests=10,
      # which is what .ci/stack.yml's Swarm deploy actually ships, since
      # that file has its own separate `environment:` block and does not
      # inherit from this one — confirmed by reading it, not assumed).
      # Real, reproducible finding: e2e/'s full suite makes 11 POST
      # /executions calls across ~20-45s (grep-counted, not estimated),
      # 1 more than prod's 10-per-60s budget — it was already sitting
      # exactly AT that budget with 10 before this override was added, so
      # any future test genuinely doing one more execution call would trip
      # it again without headroom. MP Config env-var mapping: dots/hyphens
      # -> underscores, uppercased (rate-limit.executions.max-requests ->
      # RATE_LIMIT_EXECUTIONS_MAX_REQUESTS) — standard Quarkus/SmallRye
      # convention, not a custom mechanism.
      - RATE_LIMIT_EXECUTIONS_MAX_REQUESTS=50

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
