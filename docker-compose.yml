# Local-dev stack: run everything with `docker compose up --build`.
#
# `api` bundles the Quarkus API + sandbox-runner + static-analyzer in one
# container (see Dockerfile.api for why: no real IPC contract between API
# and Sandbox Controller yet, ProcessSandboxRunner/ProcessStaticAnalyzer
# shell out to local binaries). It needs nsjail's namespace/cgroup
# privileges to actually sandbox anything — `privileged: true` + `cgroup:
# host` mirror what was needed in this project's own Fase 0.5 spike testing
# (see tasks.md "Achado de ambiente... Docker Desktop"): nsjail needs the
# HOST's root cgroupv2 hierarchy to set up its own delegated cgroup, which
# `--cgroupns=host` (this field's compose equivalent) provides — without
# it nsjail fails with "Couldn't write to cgroup.subtree_control: Device or
# resource busy", reproduced empirically running this exact compose file.
# This is broader than nsjail strictly needs and is NOT meant to be how
# this runs in production; the `.ci/` deploy path should scope this down
# (or move nsjail's capabilities to the real Sandbox Controller service
# once that split exists).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    privileged: true
    cgroup: host
    environment:
      - DOTNET_GCHeapHardLimit=0x8000000
      # Rate-limit headroom for local dev / the E2E suite ONLY — does NOT
      # touch the real production default (api/src/main/resources/
      # application.properties' rate-limit.executions.max-requests=10,
      # which is what .ci/stack.yml's Swarm deploy actually ships, since
      # that file has its own separate `environment:` block and does not
      # inherit from this one — confirmed by reading it, not assumed).
      # Real, reproducible finding: e2e/'s full suite makes 11 POST
      # /executions calls across ~20-45s (grep-counted, not estimated),
      # 1 more than prod's 10-per-60s budget — it was already sitting
      # exactly AT that budget with 10 before this override was added, so
      # any future test genuinely doing one more execution call would trip
      # it again without headroom. MP Config env-var mapping: dots/hyphens
      # -> underscores, uppercased (rate-limit.executions.max-requests ->
      # RATE_LIMIT_EXECUTIONS_MAX_REQUESTS) — standard Quarkus/SmallRye
      # convention, not a custom mechanism.
      - RATE_LIMIT_EXECUTIONS_MAX_REQUESTS=50

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
